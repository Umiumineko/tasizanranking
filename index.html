<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0,
           maximum-scale=1.0,
           user-scalable=no">
<title>くりあがりたしざん_算数の学習</title>

<style>
html,
body{
    touch-action: manipulation;
}
body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f7ff;
    margin:0;
    transition:background 0.3s;
}

h1{
    margin-top:20px;
}

#question{
    font-size:80px;
    margin-top:40px;
    margin-bottom:20px;
}

#answer{
    font-size:70px;
    height:90px;
    color:#333;
}

#message{
    height:50px;
    font-size:30px;
}

#status{
    font-size:24px;
    margin-bottom:20px;
}

#buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:nowrap;
}

button{
    width:100px;
    height:100px;
    font-size:40px;
    border:none;
    border-radius:15px;
    background:#4f8cff;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#zeroButton{
    margin-top:10px;
}

.correct{
    animation:flashGreen 0.8s;
}

.wrong{
    animation:flashRed 0.8s;
}

#resultMark{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:180px;
    font-weight:bold;
    display:none;
    z-index:1000;
    pointer-events:none;
}

@keyframes flashGreen{
    0%{background:#7cff7c;}
    100%{background:#f5f7ff;}
}

@keyframes flashRed{
    0%{background:#ff9d9d;}
    100%{background:#f5f7ff;}
}

@keyframes shake{
    0%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(10px);}
    60%{transform:translateX(-10px);}
    80%{transform:translateX(10px);}
    100%{transform:translateX(0);}
}

.shake{
    animation:shake 0.5s;
}

.confetti{
    position:fixed;
    font-size:40px;
    z-index:999;
    pointer-events:none;
}

</style>
</head>

<body>

<div id="app"></div>
<div id="resultMark"></div>
    
<script>

let problems = [];
let current = 0;
let input = "";
let startTime;

const app = document.getElementById("app");
const resultMark =
    document.getElementById("resultMark");

let question;
let answer;
let statusDiv;
let buttonsDiv;

function showStartScreen(){

    app.innerHTML = `
        <div
            style="
                margin-top:150px;
            "
        >
            <h1
                style="
                    font-size:60px;
                "
            >
                くりあがりたしざん
            </h1>

            <button
                id="startButton"
                style="
                    width:250px;
                    height:120px;
                    font-size:50px;
                    margin-top:50px;
                "
            >
                スタート
            </button>
        </div>
    `;

    document
        .getElementById("startButton")
        .addEventListener(
            "click",
            startGame
        );
}

function startGame(){

    app.innerHTML = `
        <h1>くりあがりたしざん</h1>

        <div id="status"></div>

        <div id="question"></div>

        <div id="answer"></div>

        <div id="message"></div>

        <div id="buttons"></div>
    `;

    question =
        document.getElementById("question");

    answer =
        document.getElementById("answer");

    statusDiv =
        document.getElementById("status");

    buttonsDiv =
        document.getElementById("buttons");

    for(let i=0;i<=9;i++){

    const btn =
        document.createElement("button");

    btn.textContent = i;

    btn.onclick = () => press(i);

    buttonsDiv.appendChild(btn);
}

makeProblems();

current = 0;

startTime = Date.now();

showProblem();
}
    
function makeProblems(){

    problems = [];

    while(problems.length < 10){

        const a = Math.floor(Math.random()*9)+1;
        const b = Math.floor(Math.random()*9)+1;

        if(a + b >= 10){
            problems.push({a,b});
        }
    }
}

function showProblem(){

    input = "";
    answer.textContent = "";

    const p = problems[current];

    question.textContent = `${p.a} + ${p.b} = ?`;

    statusDiv.textContent =
        `もんだい ${current + 1} / 10`;
}

document.addEventListener("keydown", (e) => {

    // 数字キー
    if(e.key >= "0" && e.key <= "9"){
        press(e.key);
    }

});


function createConfetti(){

    for(let i=0;i<30;i++){

        const c = document.createElement("div");

        c.className = "confetti";
        c.textContent = "🎉";

        c.style.left = Math.random()*100 + "vw";
        c.style.top = "-50px";

        document.body.appendChild(c);

        c.animate(
            [
                {transform:"translateY(0px) rotate(0deg)"},
                {transform:"translateY(220vh) rotate(720deg)"}
            ],
            {
                duration:1000,
                easing:"linear"
            }
        );

        setTimeout(()=>c.remove(),1000);
    }
}

function showCorrect(){

    document.body.classList.add("correct");

    resultMark.textContent = "⭕";
    resultMark.style.color = "#00aa00";
    resultMark.style.display = "block";

    createConfetti();

    setTimeout(()=>{
        document.body.classList.remove("correct");
        resultMark.style.display = "none";
    },100);
}

function showWrong(){

    document.body.classList.add("wrong");
    document.body.classList.add("shake");

    resultMark.textContent = "❌";
    resultMark.style.color = "red";
    resultMark.style.display = "block";

    setTimeout(()=>{
        document.body.classList.remove("wrong");
        document.body.classList.remove("shake");
        resultMark.style.display = "none";
    },800);
}

function check(){

    const p = problems[current];

    if(Number(input) === p.a + p.b){

        showCorrect();

        setTimeout(()=>{

            current++;

            if(current >= 10){
                finish();
                return;
            }

            showProblem();

        },100);

    }else{

        showWrong();

        setTimeout(()=>{
            showProblem();
        },800);
    }
}

function press(n){

    input += n;

    answer.textContent = input;

    if(input.length >= 2){
        check();
    }
}

async function finish(){

    const sec =
        Number(
            ((Date.now() - startTime)/1000)
            .toFixed(2)
        );

    const ranking =
        await fetch("/ranking")
          .then(r=>r.json());

    let rank = 1;

    while(
        rank <= ranking.length &&
        ranking[rank - 1].time < sec
    ){
        rank++;
    }

    // ベスト10以内
    if(rank <= 10){

        const name =
            prompt(
              `おめでとう！現在${rank}位です。\n名前を入力してください。`
            );

        if(name){

            const newRecord = {
                name: name,
                time: sec,
                date: new Date().toLocaleString("ja-JP"),
                day: new Date().toLocaleDateString("ja-JP")
            };
            await fetch("/save",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(newRecord)
            });
        
            const latest =
                await fetch("/ranking")
                 .then(r=>r.json());

            const exists = latest.some(
                r =>
                    r.name === newRecord.name &&
                    r.time === newRecord.time
            );
            
            if(!exists){
                latest.push(newRecord);
            }
            
            latest.sort(
                (a,b)=>a.time-b.time
            );

            const myRankUpdated =
                latest.findIndex(
                    r =>
                        r.name === newRecord.name &&
                        r.time === newRecord.time
                ) + 1;

            showRanking(
                sec,
                myRankUpdated,
                latest.slice(0,10)
            );
        }
        
    }else{

        document.body.innerHTML = `
        <div style="margin-top:100px">
            <h1>🎉クリア！🎉</h1>

            <h2>タイム</h2>

            <div style="
                font-size:80px;
                color:#ff8800;
            ">
            ${sec}秒
            </div>

            <h3>
              あなたの順位は
              ${rank}位です
            </h3>
        </div>
        `;

    }

}

function showRanking(
    myTime,
    myRank,
    ranking
){

    const today =
        new Date().toLocaleDateString("ja-JP");

    const todayRanking =
        ranking
        .filter(r => r.day === today)
        .sort((a,b)=>a.time-b.time)
        .slice(0,10);

    const allRanking =
        [...ranking]
        .sort((a,b)=>a.time-b.time)
        .slice(0,10);

    let html = `

    <div style="margin-top:40px">

        <h1>🎉 ランクイン！ 🎉</h1>

        <h2>${myTime}秒</h2>

        <h3>${myRank}位です！</h3>

        <hr style="width:80%;margin:30px auto;">

        <h2>🏆 本日のランキング</h2>

        <table
            style="
                margin:auto;
                font-size:24px;
                border-collapse:collapse;
            "
        >

        <tr>
            <th style="padding:10px;">順位</th>
            <th style="padding:10px;">名前</th>
            <th style="padding:10px;">タイム</th>
        </tr>
    `;

    todayRanking.forEach((r,index)=>{

        html += `
        <tr>
            <td style="padding:10px;">
                ${index+1}位
            </td>

            <td style="padding:10px;">
                ${r.name}
            </td>

            <td style="padding:10px;">
                ${r.time}秒
            </td>
        </tr>
        `;
    });

    html += `
        </table>

        <br><br>

        <h2>🌟 歴代ランキング</h2>

        <table
            style="
                margin:auto;
                font-size:24px;
                border-collapse:collapse;
            "
        >

        <tr>
            <th style="padding:10px;">順位</th>
            <th style="padding:10px;">名前</th>
            <th style="padding:10px;">タイム</th>
            <th style="padding:10px;">日付</th>
        </tr>
    `;

    allRanking.forEach((r,index)=>{

        html += `
        <tr>
            <td style="padding:10px;">
                ${index+1}位
            </td>

            <td style="padding:10px;">
                ${r.name}
            </td>

            <td style="padding:10px;">
                ${r.time}秒
            </td>

            <td style="padding:10px;">
                ${r.day || "-"}
            </td>
        </tr>
        `;
    });

    html += `
        </table>
    </div>
    `;

    app.innerHTML = html;
}

showStartScreen();
</script>

</body>
</html>
